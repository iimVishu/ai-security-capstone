<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 26px sans-serif; fill: #111827; }
      .node { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .guard { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .scan { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 14; }
      .risk { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 14; }
      .ci { fill: #e9d5ff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .secret { fill: #f3f4f6; stroke: #374151; stroke-width: 2; rx: 10; }
      .label { font: 600 18px sans-serif; fill: #111827; }
      .small { font: 500 13px sans-serif; fill: #374151; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .trust { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <text x="800" y="50" text-anchor="middle" class="title">Secure AI App Threat Model</text>

  <rect x="100" y="120" width="180" height="70" class="node"/>
  <text x="190" y="162" text-anchor="middle" class="label">User</text>

  <path d="M 280 155 L 430 155" class="arrow"/>
  <rect x="430" y="120" width="260" height="70" class="guard"/>
  <text x="560" y="162" text-anchor="middle" class="label">JWT Authentication</text>

  <path d="M 690 155 L 860 155" class="arrow"/>
  <rect x="860" y="120" width="240" height="70" class="guard"/>
  <text x="980" y="162" text-anchor="middle" class="label">Flask /chat</text>

  <path d="M 1100 155 L 1280 155" class="arrow"/>
  <rect x="1280" y="120" width="220" height="70" class="scan"/>
  <text x="1390" y="162" text-anchor="middle" class="label">Input Validation</text>

  <path d="M 1390 190 L 1390 330" class="arrow"/>
  <rect x="1270" y="330" width="240" height="70" class="scan"/>
  <text x="1390" y="372" text-anchor="middle" class="label">Ollama / LLM</text>

  <path d="M 1270 365 L 1100 365" class="arrow"/>
  <rect x="860" y="330" width="240" height="70" class="scan"/>
  <text x="980" y="372" text-anchor="middle" class="label">Output Scanner</text>

  <path d="M 860 365 L 680 365" class="arrow"/>
  <rect x="430" y="330" width="250" height="70" class="guard"/>
  <text x="555" y="372" text-anchor="middle" class="label">Response</text>

  <rect x="100" y="500" width="220" height="80" class="secret"/>
  <text x="210" y="545" text-anchor="middle" class="label">JWT_SECRET</text>
  <text x="210" y="565" text-anchor="middle" class="small">Environment variable</text>

  <rect x="380" y="500" width="260" height="80" class="secret"/>
  <text x="510" y="545" text-anchor="middle" class="label">OLLAMA_URL</text>
  <text x="510" y="565" text-anchor="middle" class="small">Local model endpoint</text>

  <rect x="700" y="500" width="270" height="80" class="secret"/>
  <text x="835" y="545" text-anchor="middle" class="label">MODEL</text>
  <text x="835" y="565" text-anchor="middle" class="small">Configured model</text>

  <path d="M 210 580 L 210 720" class="arrow"/>
  <path d="M 510 580 L 510 720" class="arrow"/>
  <path d="M 835 580 L 835 720" class="arrow"/>

  <rect x="100" y="720" width="280" height="80" class="ci"/>
  <text x="240" y="760" text-anchor="middle" class="label">Bandit</text>
  <rect x="420" y="720" width="280" height="80" class="ci"/>
  <text x="560" y="760" text-anchor="middle" class="label">Safety</text>
  <rect x="740" y="720" width="280" height="80" class="ci"/>
  <text x="880" y="760" text-anchor="middle" class="label">Gitleaks</text>
  <rect x="1060" y="720" width="420" height="80" class="ci"/>
  <text x="1270" y="760" text-anchor="middle" class="label">Custom Prompt Injection Scanner</text>

  <rect x="400" y="820" width="760" height="120" class="risk"/>
  <text x="780" y="860" text-anchor="middle" class="label">Threats and mitigations</text>
  <text x="780" y="885" text-anchor="middle" class="small">Missing auth, stolen JWT, prompt injection, unsafe output, dependency CVEs, leaked secrets, CI malicious code</text>

  <rect x="60" y="90" width="1510" height="860" class="trust"/>
  <text x="1040" y="120" text-anchor="end" class="small">Trust boundary</text>
</svg>

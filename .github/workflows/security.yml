name: AI Security DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-1-bandit:
    name: "Gate 1 - Bandit SAST"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip bandit
      - name: Run Bandit recursively
        run: bandit -r app.py project2 tests -q

  gate-2-safety:
    name: "Gate 2 - Safety Dependency Scan"
    needs: gate-1-bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip safety
      - name: Run Safety dependency scan
        run: safety check -r requirements.txt --full-report

  gate-3-gitleaks:
    name: "Gate 3 - Gitleaks Secret Detection"
    needs: gate-2-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --config .gitleaks.toml --no-git --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate-4-prompt-scanner:
    name: "Gate 4 - Custom Prompt Injection Scanner"
    needs: gate-3-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run custom scanner
        run: python project5/inject_scanner.py .